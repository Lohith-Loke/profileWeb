name: Cloudflare Deploy Status

on:
  push:
    branches: [main]
  pull_request:

jobs:
  monitor-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Wait for the native Cloudflare Pages status check to succeed
      - name: Wait commit status
        uses: cloudposse/github-action-wait-commit-status@main
        with:
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          # This is the exact name of the status Cloudflare sends to GitHub
          status: "Cloudflare Pages"
          lookup: "success"
          token: ${{ github.token }}
          # Cloudflare builds usually take 1-3 minutes. 
          # Let's adjust retries to wait up to 5 minutes total (15 retries * 20s)
          check-timeout: 10
          check-retry-count: 15
          check-retry-interval: 20

      # This step only runs if the step above succeeds (Cloudflare build passed)
      - name: Post-deployment tasks
        run: |
          echo "Cloudflare Pages deployed successfully!"